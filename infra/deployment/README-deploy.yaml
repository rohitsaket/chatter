# Deployment topology (compose-based; adapt per environment)
#
#   web    -> Next.js server (port 3000), behind a TLS-terminating proxy
#   api    -> NestJS API + Socket.IO (port 4000); scale horizontally —
#             Socket.IO uses the Redis adapter so any node can serve any client
#   worker -> BullMQ consumers; scale by queue depth
#   postgres, redis, minio (or AWS S3), livekit (managed or self-hosted)
#
# Required production secrets:
#   SESSION_SECRET     long random string
#   DATABASE_URL       managed Postgres URL
#   REDIS_URL          managed Redis URL
#   S3_*               object-storage credentials (STORAGE_DRIVER=s3)
#   LIVEKIT_*          calls remain truthfully disabled until set
#
# Boot order: migrate (prisma migrate deploy) -> api -> worker -> web.
production:
  compose_file: ../docker/docker-compose.yml
  notes: "Set COOKIE_SECURE=true behind HTTPS."
