name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chatter
          POSTGRES_PASSWORD: chatter
          POSTGRES_DB: chatter
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chatter"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://chatter:chatter@localhost:5432/chatter
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @chatter/database db:generate
      - name: Migrate and seed
        run: |
          pnpm --filter @chatter/database db:migrate
          pnpm --filter @chatter/database build
          pnpm --filter @chatter/database db:seed
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: E2E
        run: |
          cp .env.example .env
          node apps/api/dist/main.js &
          pnpm --filter @chatter/web start &
          npx --yes wait-on http://localhost:4000/health http://localhost:3000/auth/login
          cd apps/web
          npx playwright install --with-deps chromium
          npx playwright test
